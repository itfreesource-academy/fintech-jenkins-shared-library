version: '3.8'

networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
  docker_certs:

services:
  # 1. Jenkins LTS Controller (Port 8085)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: fintech-jenkins-controller
    networks:
      - jenkins-net
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dfile.encoding=UTF-8"
      DOCKER_HOST: "tcp://docker-dind:2376"
      DOCKER_CERT_PATH: "/certs/client"
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_certs:/certs/client:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - docker-dind

  # 2. Docker-in-Docker Daemon for Isolated Test Agent Containers
  docker-dind:
    image: docker:dind
    container_name: fintech-jenkins-dind
    privileged: true
    networks:
      - jenkins-net
    environment:
      DOCKER_TLS_CERTDIR: "/certs"
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_certs:/certs/client
    restart: unless-stopped
